
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Emulator | Game Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #182421;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px 30px;
            background: #101a17;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        a {
            color: #8ee6b1;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .player {
            background: #101a17;
            padding: 20px;
            border-radius: 12px;
        }

        #game {
            width: 100%;
            min-height: 400px;
            background: black;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button, .file-button {
            background: #36a66d;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover, .file-button:hover {
            background: #278653;
        }

        #status {
            margin-top: 15px;
            color: #a7b8ae;
        }

        input {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h2>game hub</h2>
    <a href="index.html">← back</a>
</header>

<main>
    <div class="player">

        <h2>nintendo ds emulator</h2>
        <br>

        <div class="controls">
            <label class="file-button" for="rom">
                select nds game
            </label>

            <input
                type="file"
                id="rom"
                accept=".nds,.zip"
            >

            <button onclick="fullscreen()">
                fullscreen
            </button>
        </div>

        <div id="game"></div>

        <p id="status">select an nds game to begin.</p>

    </div>
</main>

<script>
    const romInput = document.getElementById("rom");
    const status = document.getElementById("status");

    let emulatorStarted = false;

    romInput.addEventListener("change", function() {
        const file = this.files[0];

        if (!file) return;

        if (emulatorStarted) {
            location.reload();
            return;
        }

        status.textContent = "loading game...";

        window.EJS_player = "#game";
        window.EJS_core = "nds";
        window.EJS_pathtodata = "./emulator/";
        window.EJS_gameUrl = URL.createObjectURL(file);
        window.EJS_gameName = file.name;

        emulatorStarted = true;

        const script = document.createElement("script");
        script.src = "./emulator/loader.js";

        script.onload = function() {
            status.textContent = "emulator loaded.";
        };

        script.onerror = function() {
            status.textContent = "error loading emulator. check your emulator folder.";
        };

        document.body.appendChild(script);
    });

    function fullscreen() {
        const game = document.getElementById("game");

        if (game.requestFullscreen) {
            game.requestFullscreen();
        }
    }
</script>

</body>
</html>

</html>
