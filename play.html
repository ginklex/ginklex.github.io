
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #182421;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 30px;
            background: #101a17;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 24px;
        }

        a {
            color: #8ee6b1;
            text-decoration: none;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            flex: 1;
        }

        .player {
            background: #101a17;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #30453c;
        }

        #game {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            overflow: hidden;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }

        button {
            background: #36a66d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #278653;
        }

        .info {
            color: #a7b8ae;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header>
    <h1>game hub</h1>
    <a href="index.html">← back to games</a>
</header>

<main>
    <div class="player">
        <div id="game"></div>

        <div class="controls">
            <span id="status">waiting for game...</span>
            <button onclick="fullscreen()">fullscreen</button>
        </div>
    </div>

    <div class="info">
        <h2>game player</h2>
        <p>select a game from the main page to start playing.</p>
    </div>
</main>

<script>
    function fullscreen() {
        const game = document.getElementById("game");

        if (game.requestFullscreen) {
            game.requestFullscreen();
        }
    }

    // EmulatorJS configuration
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_pathtodata = "./emulator/";
    window.EJS_gameUrl = "";

    window.EJS_ready = function() {
        document.getElementById("status").textContent = "game loaded";
    };

    window.EJS_onGameStart = function() {
        document.getElementById("status").textContent = "playing";
    };
</script>

<script src="./emulator/loader.js"></script>

</body>
</html>
