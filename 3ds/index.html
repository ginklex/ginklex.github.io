<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nintendo 3DS | Game Hub</title>
<script>
(() => {
    const storageKey = "gameHubUnlocked";
    let unlocked = false;
    try {
        unlocked = sessionStorage.getItem(storageKey) === "yes";
    } catch {}
    if (unlocked) return;
    document.documentElement.style.visibility = "hidden";
    while (true) {
        const code = prompt("Enter the Game Hub access code:");
        if (code === null) {
            location.replace("about:blank");
            return;
        }
        if (code.trim() === "667788") {
            try {
                sessionStorage.setItem(storageKey, "yes");
            } catch {}
            document.documentElement.style.visibility = "";
            return;
        }
        alert("Incorrect code. Try again.");
    }
})();
</script>
<script src="./coi-serviceworker.js"></script>
<style>
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; font-family:Arial,sans-serif; color:#f2eee5; background:#182421 linear-gradient(#0a14165c,#0a14165c) center/cover fixed; background-image:linear-gradient(#0a14165c,#0a14165c),url('../background.png'); }
header { display:flex; justify-content:space-between; align-items:center; padding:20px 6%; background:#1c2b26ed; }
a { color:#c4d5bd; }
main { width:90%; max-width:1100px; margin:36px auto; padding:24px; background:#1c2b26eb; border:1px solid #526b5e; border-radius:14px; }
h1 { margin-top:0; } p { line-height:1.6; color:#d5ded5; }
.controls { display:flex; flex-wrap:wrap; gap:12px; margin:22px 0; }
button,.file-button { background:#91ad9a; color:#182421; border:0; border-radius:8px; padding:13px 20px; font-size:15px; font-weight:bold; cursor:pointer; }
button:disabled { opacity:.5; cursor:wait; }
#rom { position:absolute; width:1px; height:1px; opacity:0; }
#rom:focus-visible + label { outline:3px solid white; }
#game { width:100%; height:680px; max-height:85vh; min-height:400px; background:#000; }
#game:fullscreen { height:100vh; max-height:none; }
</style>
</head>
<body>
<header><strong>game hub.</strong><a href="../index.html">← Back</a></header>
<main>
<h1>Nintendo 3DS Emulator</h1>
<p>Choose a decrypted .3ds or .cci game from your device. Browser 3DS emulation is experimental and performance varies.</p>
<div class="controls">
<input type="file" id="rom" accept=".3ds,.cci" disabled>
<label class="file-button" for="rom">Select 3DS Game</label>
<button id="fullscreen" type="button">Fullscreen</button>
<button type="button" onclick="location.reload()">Restart / Change Game</button>
</div>
<div id="game"></div>
<p id="status" role="status" aria-live="polite">Checking emulator setup…</p>
<p>Use the emulator toolbar to change controls and manage saves.</p>
</main>
<script>
const input = document.getElementById('rom');
const status = document.getElementById('status');

(async () => {
    if (!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
        status.textContent = 'Preparing browser threading. This page may reload once. If it stays here, allow service workers for this site and refresh.';
        return;
    }
    try {
        const response = await fetch('../emulator3ds/loader.js', {cache:'no-store'});
        if (!response.ok) throw new Error('missing');
        input.disabled = false;
        status.textContent = 'Ready. Select a 3DS game to begin.';
    } catch {
        status.textContent = 'Setup needed: add the EmulatorJS 4.3.0-pre data files to the emulator3ds folder. See the included setup instructions.';
    }
})();
input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    if (!/\.(3ds|cci)$/i.test(file.name)) {
        status.textContent = 'Select a decrypted .3ds or .cci file.';
        return;
    }
    input.disabled = true;
    status.textContent = 'Loading emulator… large games may take time.';
    window.EJS_player = '#game';
    window.EJS_core = '3ds';
    window.EJS_threads = true;
    window.EJS_pathtodata = '../emulator3ds/';
    window.EJS_gameUrl = file;
    window.EJS_gameName = file.name;
    window.EJS_onGameStart = () => { status.textContent = 'Game running.'; };
    const loader = document.createElement('script');
    loader.src = '../emulator3ds/loader.js';
    loader.onerror = () => { status.textContent = 'Could not load the emulator. Check the emulator3ds folder and browser Console.'; };
    document.body.appendChild(loader);
});
document.getElementById('fullscreen').addEventListener('click', async () => {
    try { await document.getElementById('game').requestFullscreen(); }
    catch { status.textContent = 'Fullscreen is unavailable in this browser.'; }
});

</script>
</body>
</html>
